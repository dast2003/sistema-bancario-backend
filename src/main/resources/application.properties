spring.application.name=banco-backend
server.port=8080

# H2 en archivo: los datos sobreviven al reinicio.
spring.datasource.url=jdbc:h2:file:./data/bancodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: en un entorno real define la variable JWT_SECRET (Base64, minimo 256 bits).
app.jwt.secret=${JWT_SECRET:rA2NjDg1BmpK4MUqr5k8ZDjHELAjG2B35skE3hz5bQiEDf/HT8b+acswnpKpP4yS}
app.jwt.expiracion-ms=3600000

# Origen permitido para el frontend Angular
app.cors.allowed-origins=http://localhost:4200

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
